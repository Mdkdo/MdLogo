<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Turtle Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Interpréteur Logo</h1>
            <a href="help.html" id="help-link" target="_blank">Aide (?)</a>
        </header>
        <main>
            <div id="editor-container">
                <div id="toolbar">
                    <select id="lang-select">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                    </select>
                    <select id="examples-select">
                        <option value="">-- Choisir un exemple --</option>
                    </select>
                    <button id="save-btn" title="Sauvegarder">💾</button>
                    <span id="save-status"></span>
                </div>
                <div id="editor-wrapper">
                    <div id="highlight-layer"></div>
                    <textarea id="code-editor" spellcheck="false" placeholder="Entrez vos commandes Logo ici...&#10;Exemple: repeat 4 [ fd 100 rt 90 ]"></textarea>
                </div>
                <div id="controls">
                    <button id="run-btn">Exécuter</button>
                    <button id="clear-btn">Effacer</button>
                </div>
            </div>
            <div id="canvas-container">
                <canvas id="turtle-canvas" width="600" height="500"></canvas>
            </div>
        </main>
        <div id="output-console"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
